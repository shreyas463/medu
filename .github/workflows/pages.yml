name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mask the counter code
        run: |
          if [ -n "$GOATCOUNTER" ]; then
            echo "::add-mask::$GOATCOUNTER"
          fi
        env:
          GOATCOUNTER: ${{ vars.GOATCOUNTER }}
      - run: npm run build
        env:
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
